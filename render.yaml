databases:
  - name: registre-cancer-db
    databaseName: registre_db
    user: registre_user
    plan: free

services:
  - type: web
    name: registre-cancer-backend
    runtime: docker
    dockerfile: backend.Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: registre-cancer-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generate: true
      - key: ALLOWED_HOSTS
        value: "*"
